<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <header>
        <h1>Calculator</h1>
    </header>
    <main>
        <div class="container">
            <div class="calc-container">
                <div class="result-display">
                    <div class="result">
                        <span class="expression">21223+212123</span>
                        <span class="equals">=</span>
                        <span class="answer">246</span>
                    </div>
                </div>
                <div class="operation-display">
                    <div class="operation"></div>
                    <div class="error-text"></div>
                </div>
                <div class="buttons-display">
                    <div class="col-1">
                        <button id="clear" class="bold-button">C</button>
                        <button id="seven" class="digit bold-button">7</button>
                        <button id="four" class="digit bold-button">4</button>
                        <button id="one" class="digit bold-button">1</button>
                        <button id="zero" class="digit bold-button">0</button>
                    </div>
                    <div class="col-2">
                        <button id="left-parenthesis">&lpar;</button>
                        <button id="eight" class="digit bold-button">8</button>
                        <button id="five" class="digit bold-button">5</button>
                        <button id="two" class="digit bold-button">2</button>
                        <button id="dot">.</button>
                    </div>
                    <div class="col-3">
                        <button id="right-parenthesis">&rpar;</button>
                        <button id="nine" class="digit bold-button">9</button>
                        <button id="six" class="digit bold-button">6</button>
                        <button id="three" class="digit bold-button">3</button>
                        <button id="percent">%</button>
                    </div>
                    <div class="col-4">
                        <button id="mod">mod</button>
                        <button id="divide">/</button>
                        <button id="multiply">*</button>
                        <button id="subtract">-</button>
                        <button id="add">+</button>
                    </div>
                    <div class="col-5">
                        <button id="pi">&pi;</button>
                        <button id="sqrt">&radic;</button>
                        <button id="square">x<sup>2</sup></button>
                        <button id="equal">=</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
